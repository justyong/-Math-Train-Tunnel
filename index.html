<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기차 터널 길잡이</title>
<style>
:root{
  color-scheme: light;
  --bg:#EEF1F0; --card:#FFFFFF; --ink:#1B2420; --soft:#59665F; --line:#D6DDD9;
  --deep:#24433A; --lane:#F2B705; --on-lane:#1A1400;
  --good:#14794E; --good-bg:#E3F3EB; --bad:#C23B2A; --bad-bg:#FBE9E6;
  --chip:#E3E9E6; --focus:#1D4E89; --info:#1D4E89; --info-bg:#E6EEF8;
  box-sizing:border-box;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.7;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
h1{font-size:30px;margin:8px 0 2px;line-height:1.2}
h2{font-size:22px;margin:0;line-height:1.3}
.sub{color:var(--soft);margin:0 0 16px;font-size:15px}
.lane{border-top:4px dashed var(--lane);margin:16px 0}
.lvbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.lv{font:inherit;background:var(--deep);color:#fff;border:0;border-radius:10px;padding:10px 4px;cursor:pointer;min-height:60px;opacity:.7;border-bottom:5px solid transparent}
.lv b{display:block;font-size:17px;font-weight:700}
.lv small{font-size:12px;opacity:.9}
.lv.on{border-bottom-color:var(--lane);opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{font:inherit;font-size:14px;background:var(--chip);color:var(--ink);border:2px solid transparent;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px;text-align:left}
.chip.on{border-color:var(--lane);background:var(--card);font-weight:700}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.card{background:var(--card);border-radius:14px;padding:18px 16px;margin-bottom:14px;border:1px solid var(--line)}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.no{background:var(--deep);color:#fff;border-radius:8px;padding:2px 10px;font-size:14px;font-weight:700}
.key{background:var(--lane);color:var(--on-lane);border-radius:10px;padding:10px 14px;font-weight:700;margin:10px 0}
.key small{display:block;font-weight:500;opacity:.85}
.tag{display:inline-block;font-size:13px;font-weight:700;color:var(--soft);margin-bottom:4px}
.q{margin:6px 0 10px;font-size:17px}
.note{font-size:14px;color:var(--soft);margin:4px 0}
.diag{display:grid;gap:6px;margin:8px 0 12px}
.bar{height:30px;border-radius:8px;display:flex;align-items:center;padding:0 10px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden}
details{border:1px solid var(--line);border-radius:10px;margin:10px 0;background:var(--card)}
summary{cursor:pointer;padding:11px 14px;font-weight:700;min-height:44px}
details>div.in{padding:2px 14px 14px}
.stp{margin:14px 0;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.stp:last-child{border-bottom:0}
.stp b{display:block;margin-bottom:2px;font-size:16px}
.stp p{margin:4px 0}
.eq{background:var(--chip);border-radius:8px;padding:7px 12px;margin:5px 0;font-weight:500;overflow-x:auto}
.concept{background:var(--info-bg);color:var(--info);border-radius:10px;padding:10px 14px;margin:14px 0}
.concept b{display:block;margin-bottom:2px}
.concept p{margin:4px 0;color:var(--ink)}
.check{border-left:4px solid var(--good);background:var(--good-bg);border-radius:8px;padding:10px 14px;margin:14px 0}
.check b{display:block;color:var(--good);margin-bottom:2px}
.check p{margin:4px 0}
.tip{color:var(--soft);font-size:14.5px}
.ans{font-weight:700;color:var(--good);font-size:17px}
.try{border-top:4px dashed var(--lane);margin-top:18px;padding-top:14px}
.try h3{margin:0 0 4px;font-size:18px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
input[type=text]{font:inherit;font-size:18px;width:130px;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:46px}
input[type=text].good{border-color:var(--good)}
input[type=text].bad{border-color:var(--bad)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;min-height:46px;background:var(--lane);color:var(--on-lane)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fb{border-radius:10px;padding:10px 14px;margin:8px 0;font-weight:500}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.hintbox{border:2px dashed var(--bad);border-radius:10px;padding:10px 12px;margin:8px 0}
.hintbox p{margin:2px 0}
.tally{font-size:14px;color:var(--soft);margin:6px 0 0}
.story{background:var(--chip);border-radius:10px;padding:12px 14px;margin:8px 0 12px;font-size:16.5px;line-height:1.8}
.more{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>기차 터널 길잡이</h1>
  <p class="sub">거리·속력·시간 · 기차가 터널과 다리를 지나는 문제 · 단계별 연습</p>
  <div class="lvbar" id="lvbar" role="tablist" aria-label="단계 고르기"></div>
  <div class="chips" id="chips" role="tablist" aria-label="유형 고르기"></div>
  <div class="lane"></div>
  <main id="main"></main>
</div>

<script>
(function(){
'use strict';
/* ===== 도구 함수 ===== */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const tryGen=f=>{for(let k=0;k<3000;k++){const r=f();if(r)return r;}return null;};
const make=g=>{let r=null;while(!r)r=g();return r;};
const EQ=t=>`<div class="eq">${t}</div>`;
const P=t=>`<p>${t}</p>`;
const ST=(n,t,...p)=>`<div class="stp"><b>${n} ${t}</b>${p.join('')}</div>`;
const CON=arr=>`<div class="concept"><b>📘 개념 정리</b>${arr.map(s=>`<p>${s}</p>`).join('')}</div>`;
const CHK=s=>`<div class="check"><b>✅ 검산 (답이 맞는지 확인)</b><p>${s}</p></div>`;
const SPEEDS=[10,15,20,25,30];
const C_TUN='#24433A', C_TRN='#F2B705', C_TRN2='#2F6F8F';

/* 길이를 대략 비교하는 막대 그림 (실제 비율과 조금 다를 수 있음) */
function diag(items){
  const mx=Math.max(...items.map(i=>i.len));
  return `<div class="diag" aria-hidden="true">${items.map(i=>`<div class="bar" style="width:${Math.max(30,Math.round(i.len/mx*100))}%;background:${i.c};color:${i.ink}">${i.n} ${i.len}m</div>`).join('')}</div><p class="note">※ 막대는 길이를 대략 비교하기 위한 그림이에요.</p>`;
}

/* ================= 기본 ================= */
/* 기차가 터널을 빠져나오는 시간 */
const G1=()=>tryGen(()=>{
  const v=pick(SPEEDS),L=pick([100,120,150,200,250]),T=pick([300,400,500,600,800,900]),D=L+T;
  if(D%v)return null;
  const t=D/v;
  return {unit:'초',ans:t,
    fig:diag([{n:'터널',len:T,c:C_TUN,ink:'#fff'},{n:'기차',len:L,c:C_TRN,ink:'#1A1400'}]),
    q:`길이가 ${L}m인 기차가 길이 ${T}m인 터널에 들어갑니다. 기차는 1초에 ${v}m를 갑니다. 기차 전체가 터널을 완전히 빠져나올 때까지 걸리는 시간은 몇 초입니까?`,
    hint:'기차의 맨 앞이 출구에 닿아도 맨 뒤는 아직 터널 안에 있어요. 맨 뒤까지 나와야 하므로, 기차가 간 거리는 터널 길이와 기차 길이를 더한 값이에요.',
    steps:[
      ST('①','출발점과 도착점을 정합니다.',P('출발: 기차의 맨 앞이 터널 입구에 닿은 순간'),P('도착: 기차의 맨 뒤가 터널 출구를 빠져나온 순간'),P('맨 앞은 터널 길이만큼만 가면 출구에 닿지만, 맨 뒤는 기차 길이만큼 더 가야 완전히 나옵니다.')),
      ST('②','움직인 거리를 구합니다.',EQ('(움직인 거리) = (터널 길이) + (기차 길이)'),EQ(`${T} + ${L} = ${D}(m)`)),
      ST('③','걸린 시간을 구합니다.',P('(시간) = (거리) ÷ (속력)'),EQ(`${D} ÷ ${v} = ${t}(초)`))],
    concept:CON(['거리 = 속력 × 시간, 시간 = 거리 ÷ 속력 관계를 기억하세요.','"완전히 지난다", "완전히 빠져나온다"는 말은 기차 길이를 꼭 더해야 한다는 신호입니다.']),
    check:CHK(`${v}m씩 ${t}초 동안 가면 ${v} × ${t} = ${D}m입니다. 터널 ${T}m와 기차 ${L}m의 합과 같으므로 맞습니다.`),
    last:`답: ${t}초.`};
});

/* 통과 시간으로 터널 길이 구하기 */
const G2=()=>tryGen(()=>{
  const v=pick(SPEEDS),L=pick([100,120,150,200,250,300]),t=ri(30,120),D=v*t,T=D-L;
  if(T<200||T>1200||T%10)return null;
  return {unit:'m',ans:T,fig:'',
    q:`길이가 ${L}m인 기차가 터널을 완전히 통과하는 데 ${t}초가 걸렸습니다. 기차는 1초에 ${v}m를 갑니다. 터널의 길이는 몇 m입니까?`,
    hint:`먼저 기차가 ${t}초 동안 간 거리를 구해 보세요. 그 거리는 터널 길이와 기차 길이를 더한 값이에요.`,
    steps:[
      ST('①','기차가 간 거리를 구합니다.',P('(속력) × (시간) = (거리)'),EQ(`${v} × ${t} = ${D}(m)`)),
      ST('②','터널 길이를 구합니다.',P('움직인 거리는 (터널 길이) + (기차 길이)이므로, 터널 길이는 움직인 거리에서 기차 길이를 뺍니다.'),EQ(`${D} − ${L} = ${T}(m)`))],
    concept:CON(['(움직인 거리) = (터널 길이) + (기차 길이)','문제에서 구하는 값이 무엇인지 먼저 확인하고, 나머지 값을 식에서 옮겨 씁니다.']),
    check:CHK(`터널 ${T}m + 기차 ${L}m = ${T+L}m이고, ${v} × ${t} = ${D}m입니다. 두 값이 같으므로 맞습니다.`),
    last:`답: ${T}m.`};
});

/* ================= 응용 ================= */
/* 기차 전체가 터널 안에 있는 시간 */
const G3=()=>tryGen(()=>{
  const v=pick(SPEEDS),L=pick([100,120,150,200,250]),T=pick([300,400,500,600,800,900]),d=T-L;
  if(d%v)return null;
  const t=d/v;
  return {unit:'초',ans:t,
    fig:diag([{n:'터널',len:T,c:C_TUN,ink:'#fff'},{n:'기차',len:L,c:C_TRN,ink:'#1A1400'}]),
    q:`길이가 ${L}m인 기차가 길이 ${T}m인 터널을 지나갑니다. 기차는 1초에 ${v}m를 갑니다. 기차 전체가 터널 안에 완전히 들어가 있어서 밖에서 기차가 보이지 않는 시간은 몇 초입니까?`,
    hint:'기차 맨 뒤가 터널 입구에 닿은 순간부터, 기차 맨 앞이 터널 출구에 닿을 때까지 움직인 거리를 생각해 보세요.',
    steps:[
      ST('①','두 순간을 나누어 생각합니다.',P('(가) 맨 뒤가 입구에 닿은 순간: 기차 맨 앞은 기차 길이 L만큼 들어와 있습니다.'),P('(나) 맨 앞이 출구에 닿은 순간: 기차 맨 앞은 터널 길이 T만큼 들어와 있습니다.'),P('기차 전체가 안에 있는 시간은 (가)부터 (나)까지입니다.')),
      ST('②','그 사이에 움직인 거리를 구합니다.',EQ('(움직인 거리) = (터널 길이) − (기차 길이)'),EQ(`${T} − ${L} = ${d}(m)`)),
      ST('③','걸린 시간을 구합니다.',P('(시간) = (거리) ÷ (속력)'),EQ(`${d} ÷ ${v} = ${t}(초)`))],
    concept:CON(['기차가 "보이지 않는" 시간은 기차 길이를 빼서 구합니다.','터널 길이보다 기차가 길면 전체가 들어가는 순간은 없습니다. 그래서 터널이 기차보다 길어야 합니다.']),
    check:CHK(`${d}m를 ${v}m씩 가면 ${v} × ${t} = ${d}m입니다. 맞습니다.`),
    last:`답: ${t}초.`};
});

/* 마주 보고 달리는 두 기차가 지나칠 때 */
const G4=()=>tryGen(()=>{
  const v1=pick([10,15,20]),v2=pick([10,15,20,25]),s=v1+v2,L1=pick([100,150,200,250]),L2=pick([100,150,200,300]),D=L1+L2;
  if(D%s)return null;
  const t=D/s;
  return {unit:'초',ans:t,
    fig:diag([{n:'기차 A',len:L1,c:C_TRN,ink:'#1A1400'},{n:'기차 B',len:L2,c:C_TRN2,ink:'#fff'}]),
    q:`길이 ${L1}m인 기차 A는 1초에 ${v1}m를 가고, 길이 ${L2}m인 기차 B는 1초에 ${v2}m를 갑니다. 두 기차가 서로 마주 보고 달려서, 두 기차의 맨 앞이 만난 순간부터 두 기차가 완전히 지나칠 때까지 걸리는 시간은 몇 초입니까?`,
    hint:'두 기차가 완전히 지나가려면 두 기차 길이의 합만큼 서로 가까워져야 해요. 1초에 서로 가까워지는 거리는 두 속력의 합이에요.',
    steps:[
      ST('①','서로 가까워져야 하는 거리를 구합니다.',P('두 기차의 맨 앞이 만난 뒤, 맨 뒤끼리 지나칠 때까지 가까워져야 합니다.'),EQ(`${L1} + ${L2} = ${D}(m)`)),
      ST('②','1초에 가까워지는 거리를 구합니다.',P('마주 보고 달리므로 속력을 더합니다.'),EQ(`${v1} + ${v2} = ${s}(m)`)),
      ST('③','걸린 시간을 구합니다.',P('(시간) = (가까워진 거리) ÷ (1초에 가까워지는 거리)'),EQ(`${D} ÷ ${s} = ${t}(초)`))],
    concept:CON(['마주 보면 속력을 더하고, 같은 방향으로 가면 속력을 뺍니다.','"지나칠 때까지"는 두 기차 길이의 합만큼 가까워진다는 뜻입니다.']),
    check:CHK(`${s}m씩 ${t}초 동안 가까워지면 ${s} × ${t} = ${D}m입니다. 두 기차 길이의 합 ${D}m과 같습니다.`),
    last:`답: ${t}초.`};
});

/* 지나친 시간으로 기차 A의 길이 구하기 */
const N5=()=>tryGen(()=>{
  const v1=pick([10,15,20]),v2=pick([10,15,20,25]),s=v1+v2,L2=pick([100,150,200,300]),t=ri(8,30),D=s*t,L1=D-L2;
  if(L1<100||L1>400)return null;
  return {unit:'m',ans:L1,fig:'',
    q:`기차 A는 1초에 ${v1}m를 가고, 길이 ${L2}m인 기차 B는 1초에 ${v2}m를 갑니다. 두 기차가 서로 마주 보고 달려 맨 앞이 만난 순간부터 완전히 지나치는 데 ${t}초가 걸렸습니다. 기차 A의 길이는 몇 m입니까?`,
    hint:'두 기차가 지나칠 때 가까워진 거리는 두 기차 길이의 합이에요. 먼저 가까워진 거리를 구한 뒤, 기차 B의 길이를 빼 보세요.',
    steps:[
      ST('①','가까워진 거리를 구합니다.',P('(1초에 가까워지는 거리) × (시간) = (가까워진 거리)'),EQ(`${s} × ${t} = ${D}(m)`)),
      ST('②','기차 A의 길이를 구합니다.',P('(가까워진 거리) = (기차 A 길이) + (기차 B 길이)'),EQ(`${D} − ${L2} = ${L1}(m)`))],
    concept:CON(['구하는 값(기차 A 길이)을 □라 하고 식을 세우면 쉽습니다.','(□ + 기차 B 길이) = (가까워진 거리)에서 □를 구합니다.']),
    check:CHK(`기차 A ${L1}m + 기차 B ${L2}m = ${L1+L2}m이고, ${s} × ${t} = ${D}m입니다. 두 값이 같으니 맞습니다.`),
    last:`답: ${L1}m.`};
});

/* 필요 없는 정보가 섞인 문제 */
const N6=()=>tryGen(()=>{
  const v=pick(SPEEDS),L=pick([100,150,200,250]),T=pick([300,400,500,600,800]);
  if(T%v)return null;
  const t=T/v;
  return {unit:'초',ans:t,fig:'',
    q:`길이가 ${L}m인 기차가 길이 ${T}m인 터널에 들어갑니다. 기차는 1초에 ${v}m를 갑니다. 기차의 맨 앞이 터널 입구에서 출구에 닿을 때까지 걸리는 시간은 몇 초입니까? (기차 길이는 답을 구하는 데 필요하지 않습니다.)`,
    hint:'맨 앞이 가는 거리는 터널 길이와 같아요. 기차 길이는 이 문제에서 쓰지 않아도 됩니다.',
    steps:[
      ST('①','묻는 것을 확인합니다.',P('"맨 앞이 입구에서 출구에 닿을 때까지"는 맨 앞만 생각하는 것입니다. 맨 뒤는 이 문제와 상관없습니다.')),

    q:`길이 ${L}m인 기차가 길이 ${T}m인 터널을 완전히 통과합니다. 기차는 출발 직후 처음 ${x}m 구간에서 1초에 ${v1}m로 달렸습니다. 이 구간은 선로 공사로 천천히 달려야 했습니다. 그 뒤 나머지 구간에서는 1초에 ${v2}m로 달렸습니다. 기차 전체가 터널을 완전히 빠져나올 때까지 걸린 시간은 몇 초입니까? (기차 전체가 움직인 거리는 터널 길이와 기차 길이를 더한 값입니다.)`,
    hint:'구간마다 따로 시간을 구한 뒤 더하세요. 속력은 구간마다 다르므로 두 속력을 평균 내면 안 됩니다.',
    steps:[
      ST('①','전체 거리를 구합니다.',EQ(`${T} + ${L} = ${D}(m)`)),
      ST('②','처음 구간의 시간을 구합니다.',P('(시간) = (거리) ÷ (속력)'),EQ(`${x} ÷ ${v1} = ${t1}(초)`)),
      ST('③','나머지 구간의 시간을 구합니다.',P('나머지 거리 = 전체 거리 − 처음 구간 거리'),EQ(`${D} − ${x} = ${r}(m)`),EQ(`${r} ÷ ${v2} = ${t2}(초)`)),
      ST('④','두 시간을 더합니다.',EQ(`${t1} + ${t2} = ${t}(초)`))],
    concept:CON(['속력이 바뀌면 구간을 나누어 각각 "시간 = 거리 ÷ 속력"을 구합니다.','두 속력의 평균(예: (v1+v2)÷2)으로 한꺼번에 계산하면 틀립니다.']),
    check:CHK(`처음 구간 ${x}m ÷ ${v1}m/s = ${t1}초, 나머지 ${r}m ÷ ${v2}m/s = ${t2}초입니다. 합은 ${t}초이며, 거리 합은 ${x} + ${r} = ${D}m로 맞습니다.`),
    last:`답: ${t}초.`};
});

/* 반대 방향으로 걷는 사람과 엇갈리는 시간 (긴 지문) */
const N13=()=>tryGen(()=>{

    steps:[
      ST('①','아버지의 속력을 초속으로 바꿉니다.',P('(시속) ÷ 3.6 = (초속)'),EQ(`${ukmh} ÷ 3.6 = ${u}(m/s)`)),
      ST('②','1초에 가까워지는 거리를 구합니다.',P('반대 방향이므로 속력을 더합니다.'),EQ(`${v} + ${u} = ${s}(m/s)`)),
      ST('③','걸린 시간을 구합니다.',P('기차 전체가 지나려면 기차 길이만큼 가까워져야 합니다.'),EQ(`${L} ÷ ${s} = ${t}(초)`))],
    concept:CON(['반대 방향: 속력을 더합니다. 같은 방향: 속력을 뺍니다.','사람처럼 길이가 없는 대상은 "지나치는 거리"가 기차 길이와 같습니다.']),
    check:CHK(`${s}m/s로 ${t}초 동안 가면 ${s} × ${t} = ${L}m입니다. 기차 길이와 같습니다.`),

/* 두 구간 평균 속력 (긴 지문, 답: 시속 km) */
const N14=()=>tryGen(()=>{
  const v1=pick([10,15,20,25]),v2=pick([10,15,20,25,30]),t1=ri(10,40),t2=ri(10,40),D=v1*t1+v2*t2,T=t1+t2;
  if(v1===v2||D%T)return null;
  const avg=D/T;
  if(avg%5)return null;
  const kmh=avg*36/10;
  return {unit:'km/h',ans:kmh,fig:'',
    q:`미현이네 가족은 기차를 타고 두 구간을 이동했습니다. 첫째 구간에서 기차는 1초에 ${v1}m로 ${t1}초 동안 달렸습니다. 둘째 구간에서는 1초에 ${v2}m로 ${t2}초 동안 달렸습니다. 두 구간 사이에서 기차는 멈추지 않았습니다. 이 기차가 두 구간 전체를 달린 평균 속력은 시속 몇 km입니까?`,
    hint:'평균 속력은 (전체 거리) ÷ (전체 시간)이에요. 두 속력을 그냥 더해 2로 나누면 틀립니다.',
    steps:[
      ST('①','각 구간의 거리를 구합니다.',P('(거리) = (속력) × (시간)'),EQ(`${v1} × ${t1} = ${v1*t1}(m)`),EQ(`${v2} × ${t2} = ${v2*t2}(m)`)),
      ST('②','전체 거리와 전체 시간을 구합니다.',EQ(`거리: ${v1*t1} + ${v2*t2} = ${D}(m)`),EQ(`시간: ${t1} + ${t2} = ${T}(초)`)),
      ST('③','평균 속력을 구합니다.',P('(평균 속력) = (전체 거리) ÷ (전체 시간)'),EQ(`${D} ÷ ${T} = ${avg}(m/s)`)),
      ST('④','시속(km/h)으로 바꿉니다.',EQ(`${avg} × 3.6 = ${kmh}(km/h)`))],
    concept:CON(['평균 속력 = 전체 거리 ÷ 전체 시간','속력의 평균을 그냥 나누면 안 되는 이유: 오래 달린 구간이 평균에 더 큰 영향을 주기 때문입니다.']),
    check:CHK(`평균 ${avg}m/s × 전체 시간 ${T}초 = ${avg*T}m로, 전체 거리 ${D}m와 같습니다.`),
    last:`답: 시속 ${kmh}km.`};
});

/* 터널 두 개를 연속으로 통과 (긴 지문) */

    hint:'기차의 맨 앞이 두 번째 터널 출구까지 가는 거리는 첫 번째 터널, 다리, 두 번째 터널을 모두 더한 값이에요. 맨 뒤까지 나오려면 기차 길이를 더해야 합니다.',

    last:`답: ${t}초.`};
});

/* ===== 연습 상자 ===== */
function mount(host,list,isMix){
  host.innerHTML=`
    <div class="try">
      <h3>${isMix?'랜덤으로 풀어보기':'혼자 풀어보기'}</h3>
      <p class="q" data-r="q"></p>
      <div data-r="fig"></div>
      <div class="hintbox" data-r="hint" hidden></div>
      <div class="row">
        <label class="tip" for="${host.id}-in">답</label>
        <input type="text" inputmode="numeric" autocomplete="off" id="${host.id}-in" data-r="in">
        <span data-r="unit"></span>
        <button type="button" class="btn" data-r="chk">확인</button>
        <button type="button" class="btn ghost" data-r="new">문제 뽑기</button>
      </div>
      <div class="fb" data-r="fb" role="status" aria-live="polite" hidden></div>
      <details data-r="sol" hidden><summary>자세한 풀이 보기</summary><div class="in" data-r="solin"></div></details>
      <div class="row"><button type="button" class="btn" data-r="next" hidden>다음 문제 →</button></div>
      <p class="tally" data-r="tally"></p>
    </div>`;
  const $=n=>host.querySelector(`[data-r="${n}"]`);
  const el={q:$('q'),fig:$('fig'),hint:$('hint'),inp:$('in'),unit:$('unit'),chk:$('chk'),nw:$('new'),fb:$('fb'),sol:$('sol'),solin:$('solin'),next:$('next'),tally:$('tally')};
  let p=null,tries=0,closed=false,solved=0,right=0;
  const showFb=(c,t)=>{el.fb.hidden=false;el.fb.className='fb '+c;el.fb.textContent=t;};
  const tally=()=>{el.tally.textContent=`지금까지 푼 문제 ${solved}개 · 맞힌 문제 ${right}개`;};
  function fresh(){
    const g=isMix?pick(list):list[0];
    p=make(g.gen);p.tname=g.title;
    tries=0;closed=false;
    el.q.textContent=p.q;el.fig.innerHTML=p.fig||'';
    el.unit.textContent=`(${p.unit})`;
    el.inp.value='';el.inp.className='';el.inp.disabled=false;el.chk.disabled=false;
    el.hint.hidden=true;el.fb.hidden=true;el.sol.hidden=true;el.sol.open=false;el.next.hidden=true;
    tally();
  }
  function close(){
    closed=true;solved++;el.inp.disabled=true;el.chk.disabled=true;
    el.solin.innerHTML=p.steps.join('')+(p.concept||'')+(p.check||'')+`<p class="ans">${p.last}</p>`;
    el.sol.hidden=false;el.sol.open=true;el.next.hidden=false;tally();
  }
  function check(){
    if(closed)return;
    const raw=el.inp.value.replace(/[^0-9\-]/g,'');
    if(raw===''||raw==='-'){showFb('bad','숫자로 답을 넣어 주세요. 예: 120');return;}
    const v=Number(raw);
    const tn=isMix?` 이 문제는 ‘${p.tname}’ 유형이에요.`:'';
    if(v===p.ans){
      el.inp.className='good';
      if(tries===0)right++;
      showFb('good','○ 정답입니다! 아래 풀이로 과정도 확인해 봐요.'+tn);
      close();
    }else{
      tries++;el.inp.className='bad';
      el.hint.innerHTML=`<p>💡 ${p.hint}</p>`;el.hint.hidden=false;
      if(tries<2){showFb('bad','✕ 아쉬워요. 힌트를 보고 한 번 더 생각해 봐요.');}
      else{showFb('bad',`풀이를 보고 함께 확인해요. 정답은 ${p.ans}${p.unit}입니다.`+tn);close();}
    }
  }
  el.chk.addEventListener('click',check);
  el.inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
  el.nw.addEventListener('click',fresh);
  el.next.addEventListener('click',fresh);
  fresh();
}

/* ===== 화면 만들기 ===== */
function sectionHTML(t){
  const ex=make(t.gen);
  return `<section id="${t.id}" class="card" hidden>
    <div class="head"><span class="no">유형 ${t.no}</span><h2>${t.title}</h2></div>
    <div class="key">${t.key}<small>${t.keep}</small></div>
    <span class="tag">예제</span>
    <p class="q">${ex.q}</p>
    ${ex.fig||''}
    <details><summary>자세한 풀이 보기</summary><div class="in">${ex.steps.join('')}${ex.concept||''}${ex.check||''}<p class="ans">${ex.last}</p></div></details>
    <div id="${t.id}-try"></div>
  </section>`;
}
const main=document.getElementById('main'),chips=document.getElementById('chips'),lvbar=document.getElementById('lvbar');
main.innerHTML=TYPES.map(sectionHTML).join('')+LEVELS.map(l=>`
  <section id="${l.mix}" class="card" hidden>
    <div class="head"><span class="no">★</span><h2>${l.name} 랜덤 문제</h2></div>
    <p class="note">${l.name} 단계의 유형이 섞여 나와요. 어떤 유형인지 먼저 생각해 보세요. 답을 내고 나면 유형 이름을 알려 줘요.</p>
    <div id="${l.mix}-try"></div>
  </section>`).join('');
TYPES.forEach(t=>mount(document.getElementById(t.id+'-try'),[t],false));
LEVELS.forEach(l=>mount(document.getElementById(l.mix+'-try'),l.types,true));

function paintLevels(cur){
  lvbar.innerHTML=LEVELS.map((l,i)=>`<button type="button" class="lv${i===cur?' on':''}" role="tab" aria-selected="${i===cur}" data-lv="${i}"><b>${l.name}</b><small>${l.grade}</small></button>`).join('');
}
function paintChips(lv,cur){
  const L=LEVELS[lv];
  chips.innerHTML=L.types.map(t=>`<button type="button" class="chip${t.id===cur?' on':''}" role="tab" aria-selected="${t.id===cur}" data-go="${t.id}">${t.no}. ${t.title}</button>`).join('')
    +`<button type="button" class="chip${L.mix===cur?' on':''}" role="tab" aria-selected="${L.mix===cur}" data-go="${L.mix}">★ ${L.name} 랜덤</button>`;
}
function show(id,scroll){
  if(!ORDER.includes(id))id='t1';
  const lv=lvOf(id);
  main.querySelectorAll('section').forEach(s=>{s.hidden=s.id!==id;});
  paintLevels(lv);paintChips(lv,id);
  if(scroll!==false)window.scrollTo({top:0,behavior:'smooth'});
}
const go=id=>{try{history.replaceState(null,'','#'+id);}catch(_){}show(id);};
chips.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go);});
lvbar.addEventListener('click',e=>{const b=e.target.closest('[data-lv]');if(b)go(LEVELS[Number(b.dataset.lv)].types[0].id);});
window.addEventListener('hashchange',()=>show(location.hash.slice(1),false));
show(location.hash.slice(1)||'t1',false);
})();
</script>
</body>
</html>
